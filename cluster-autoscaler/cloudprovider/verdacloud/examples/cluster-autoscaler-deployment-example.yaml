---
# Namespace for VerdaCloud Cluster Autoscaler
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-autoscaler
  labels:
    name: cluster-autoscaler

---
# ServiceAccount for Cluster Autoscaler
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cluster-autoscaler
  name: cluster-autoscaler
  namespace: cluster-autoscaler

---
# ClusterRole with required permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    app.kubernetes.io/name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update", "delete"]
  - apiGroups: [""]
    resources:
      - "namespaces"
      - "pods"
      - "services"
      - "replicationcontrollers"
      - "persistentvolumeclaims"
      - "persistentvolumes"
    verbs: ["watch", "list", "get"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resourceNames: ["cluster-autoscaler"]
    resources: ["leases"]
    verbs: ["get", "update"]
  # Dynamic Resource Allocation (DRA) resources - required for Kubernetes 1.26+
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses"]
    verbs: ["get", "list", "watch"]
  # VolumeAttachments for storage operations
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    app.kubernetes.io/name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
- kind: ServiceAccount
  name: cluster-autoscaler
  namespace: cluster-autoscaler

---
# Role for status ConfigMap in kube-system namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler-status
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "patch", "delete"]

---
# RoleBinding for status ConfigMap in kube-system namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler-status
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler-status
subjects:
- kind: ServiceAccount
  name: cluster-autoscaler
  namespace: cluster-autoscaler

---
# Secret containing VerdaCloud credentials
apiVersion: v1
kind: Secret
metadata:
  name: verdacloud-credentials
  namespace: cluster-autoscaler
type: Opaque
# stringData accepts plaintext; the API server base64-encodes at apply time.
# Replace placeholders with real credentials before applying. For production,
# manage these via a secret manager (sealed-secrets, External Secrets, etc.)
# rather than committing values here.
stringData:
  client-id: "your-client-id"
  client-secret: "your-client-secret"

---
# ConfigMap containing cluster configuration.
#
# The autoscaler is a pure pass-through for `startupScript`: the bytes you
# put here are decoded and uploaded to Verda's CreateStartupScript API
# verbatim before each VM is created. No env-var injection, no template
# substitution, no regex rewriting.
#
# Implication: anything your script needs (kubeadm join token, master IP,
# etc.) must come from somewhere YOU control. Common patterns:
#   - hardcode values in the script body (simplest; values visible in
#     this ConfigMap and in Verda's StartupScript API);
#   - have the script fetch them at boot from a discovery endpoint or
#     metadata service;
#   - bake them into a per-cluster VM image and source them at boot.
#
# Per-VM identity (provider-id, node labels) is set post-join by the
# verdacloud cloud-controller-manager; the script uses
# `--cloud-provider=external` and does not need to know its providerID
# in advance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdacloud-cluster-config
  namespace: cluster-autoscaler
  labels:
    app: cluster-autoscaler
data:
  cluster-config.json: |
    {
      "image": {
        "gpu": "24.04.kubernetes1.31.1.cuda12.9.qcow2",
        "cpu": "24.04.kubernetes1.31.1.cuda12.9.qcow2"
      },
      "sshKeyIDs": ["your-ssh-key-id"],
      "billingConfig": {
        "price": "FIXED_PRICE",
        "contract": "PAY_AS_YOU_GO"
      },
      "debug": false,
      "availableLocations": ["FIN-02", "FIN-03"],
      "osVolumeSize": 100,
      "_comment_reapOrphanNodes": "Optional. Default false. Enable only on clusters without a verdacloud cloud-controller-manager. When true, the autoscaler deletes K8s Nodes whose VMs have disappeared from the API after reapOrphanNodesAfterCycles consecutive Refresh cycles missing (default 3). Once a CCM is deployed, set this back to false.",
      "reapOrphanNodes": false,
      "reapOrphanNodesAfterCycles": 3,
      "labels": ["env=production"],
      "_comment_startupScript": "Operator-owned bash, sent verbatim to Verda's CreateStartupScript API. Hardcode MASTER_IP/MASTER_PORT/JOIN_TOKEN/JOIN_HASH_FULL OR fetch them at boot from your own discovery mechanism. Per-VM identity (provider-id, labels) is set post-join by verdacloud-cloud-controller-manager via --cloud-provider=external; the script does not need to know its providerID in advance.",
      "startupScript": "",
      "taints": [],
      "groups": {
        "asg-name-here": {
          "labels": ["hardware=gpu", "team=ai"],
          "taints": [
            { "key": "nvidia.com/gpu", "value": "present", "effect": "NoSchedule" }
          ],
          "billingConfig": {
            "price": "FIXED_PRICE",
            "contract": "SPOT"
          },
          "osVolumeSize": 200,
          "availableLocations": ["FIN-02"]
        }
      }
    }

---
# Deployment for VerdaCloud Cluster Autoscaler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: cluster-autoscaler
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8085'
    spec:
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cluster-autoscaler
      containers:
        # Replace <VERSION> with the first cluster-autoscaler release that
        # includes the verdacloud provider (see https://github.com/kubernetes/autoscaler/releases).
      - image: registry.k8s.io/autoscaling/cluster-autoscaler:<VERSION>
        name: cluster-autoscaler
        resources:
          limits:
            cpu: 100m
            memory: 600Mi
          requests:
            cpu: 100m
            memory: 600Mi
        command:
        - ./cluster-autoscaler
        - --v=4
        - --stderrthreshold=info
        - --cloud-provider=verdacloud
        - --skip-nodes-with-local-storage=false
        - --expander=least-waste
        - --cloud-config=/etc/verdacloud/cluster-config.json
        # Format: min:max:instance-type:asg-name[:hostname-prefix]
        # Locations are configured via cloudConfig.availableLocations, not here.
        - --nodes=0:5:1A6000.10V:gpu-workers:hostname-prefix-here
        - --scale-down-delay-after-add=10m
        - --scale-down-unneeded-time=10m
        - --max-node-provision-time=15m
        - --scan-interval=10s
        - --scale-down-delay-after-delete=10s
        - --scale-down-delay-after-failure=3m
        - --balance-similar-node-groups
        - --skip-nodes-with-system-pods=false
        env:
        - name: VERDA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: verdacloud-credentials
              key: client-id
        - name: VERDA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: verdacloud-credentials
              key: client-secret
        - name: VERDA_BASE_URL
          value: "https://api.verda.com/v1"
        - name: VERDA_CLUSTER_CONFIG_FILE
          value: "/etc/verdacloud/cluster-config.json"
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health-check
            port: 8085
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health-check
            port: 8085
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        ports:
        - containerPort: 8085
          name: http
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/ssl/certs/ca-certificates.crt
          name: ssl-certs
          readOnly: true
        - mountPath: /etc/verdacloud
          name: verdacloud-config
          readOnly: true
      volumes:
      - hostPath:
          path: /etc/ssl/certs/ca-certificates.crt
          type: File
        name: ssl-certs
      - configMap:
          name: verdacloud-cluster-config
        name: verdacloud-config
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      nodeSelector:
        kubernetes.io/os: linux

---
# Sample workload for testing autoscaling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-cluster-autoscaler-sample
  namespace: default
  labels:
    app: test-cluster-autoscaler-sample
    datacrunch.io/hidden: "true"
    verda.com/hidden: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-cluster-autoscaler-sample
  template:
    metadata:
      labels:
        app: test-cluster-autoscaler-sample
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: verda.com/node-group   # must match *exactly*
                operator: In
                values:
                - "asg-pro6000-8x"
      containers:
      - name: gpu-test
        # CHANGED: Use official NVIDIA base image (~150MB) instead of nginx
        image: nvidia/cuda:12.4.1-base-ubuntu22.04
        # CHANGED: Added command to keep pod alive and log GPU status
        command:
        - "/bin/sh"
        - "-c"
        - "while true; do echo 'Checking GPU status...'; nvidia-smi; sleep 300; done"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            nvidia.com/gpu: "1"
          limits:
            cpu: 500m
            memory: 256Mi
            nvidia.com/gpu: "1"
