name: Cluster Autoscaler Release Image

# Tag cluster-autoscaler-<k8s minor>-verda.<n> (e.g. cluster-autoscaler-1.35-verda.2) publishes
# ghcr.io/verda-cloud/cluster-autoscaler:<k8s minor>-verda.<n> with only the Verda provider compiled in.
on:
  push:
    tags:
      - "cluster-autoscaler-*-verda.*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/verda-cloud/cluster-autoscaler

jobs:
  image:
    name: Build and push (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # One build per arch: the Dockerfile cross-compiles from its GOARCH build-arg, not TARGETARCH.
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Derive version
        id: version
        run: |
          version="${GITHUB_REF_NAME#cluster-autoscaler-}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+-verda\.[0-9]+$ ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match cluster-autoscaler-<major>.<minor>-verda.<n>" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cluster-autoscaler
          file: cluster-autoscaler/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          build-args: |
            GOARCH=${{ matrix.arch }}
            TAGS_FLAG=-tags=verdacloud
            LDFLAGS_FLAG=-ldflags=-s
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # Single-manifest per-arch tags so the manifest job can combine them with imagetools.
          provenance: false

  manifest:
    name: Publish multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect manifest
        run: |
          version="${GITHUB_REF_NAME#cluster-autoscaler-}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${version}" \
            "${IMAGE}:${version}-amd64" \
            "${IMAGE}:${version}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${version}"
